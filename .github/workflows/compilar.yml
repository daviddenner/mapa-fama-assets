# Compila os firmwares com os pacotes oficiais (ESP8266 e ESP32) e roda os
# testes no PC a cada envio. Se algo quebrar, aparece um X vermelho no GitHub.
name: Compilar firmwares

on:
  push:
    paths:
      - "sino-gps/**"
      - "teste-rede-esp32/**"
      - ".github/workflows/compilar.yml"
  workflow_dispatch:

env:
  URL_ESP8266: https://arduino.esp8266.com/stable/package_esp8266com_index.json
  URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  testes-pc:
    name: Testes no PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sino GPS
        run: cd sino-gps/testes && g++ -std=c++17 -Wall -Wextra -I../sino_gps teste_logica.cpp -o teste && ./teste
      - name: Teste de rede
        run: cd teste-rede-esp32/testes && g++ -std=c++17 -Wall -Wextra -I../teste_rede teste_analise.cpp -o teste && ./teste

  sino-esp8266:
    name: Sino GPS (ESP8266)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar pacote ESP8266
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP8266"
          arduino-cli core install esp8266:esp8266 --additional-urls "$URL_ESP8266"
      - name: Compilar
        run: arduino-cli compile --fqbn esp8266:esp8266:generic --warnings default sino-gps/sino_gps

  teste-rede-esp32:
    name: Teste de rede (ESP32 ${{ matrix.versao }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versao: ["2.0.17", "ultima"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar pacote ESP32
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          if [ "${{ matrix.versao }}" = "ultima" ]; then NUCLEO=esp32:esp32; else NUCLEO=esp32:esp32@${{ matrix.versao }}; fi
          arduino-cli core install "$NUCLEO" --additional-urls "$URL_ESP32"
          arduino-cli core list
      - name: Compilar
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default teste-rede-esp32/teste_rede
