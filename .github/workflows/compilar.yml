# Compila os firmwares com os pacotes oficiais (ESP8266 e ESP32) e roda os
# testes no PC a cada envio. Se algo quebrar, aparece um X vermelho no GitHub.
name: Compilar firmwares

on:
  push:
    paths:
      - "sino-gps/**"
      - "teste-rede/**"
      - "hardware/**"
      - ".github/workflows/compilar.yml"
  workflow_dispatch:

env:
  URL_ESP8266: https://arduino.esp8266.com/stable/package_esp8266com_index.json
  URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  testes-pc:
    name: Testes no PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sino GPS
        run: cd sino-gps/testes && g++ -std=c++17 -Wall -Wextra -I../sino_gps teste_logica.cpp -o teste && ./teste
      - name: Sino GPS (pagina)
        run: cd sino-gps/testes && g++ -std=c++17 -Wall -Wextra -I../sino_gps teste_web.cpp -o teste_web && ./teste_web
      - name: Sino GPS (hora pela rede)
        run: cd sino-gps/testes && g++ -std=c++17 -Wall -Wextra -I../sino_gps teste_ntp.cpp -o teste_ntp && ./teste_ntp
      - name: Teste de rede
        run: cd teste-rede/testes && g++ -std=c++17 -Wall -Wextra -I../teste_rede teste_analise.cpp -o teste && ./teste

  esquema:
    name: Esquema (Eagle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar e conferir os esquemas
        run: |
          cd hardware
          python3 gerar_esquema.py
          git diff --exit-code -- Sino_IFMS_v2.sch esquema.svg Sino_IFMS_ESP12.sch esquema_esp12.svg

  sino-esp8266:
    name: Sino GPS (ESP8266)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar pacote ESP8266
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP8266"
          arduino-cli core install esp8266:esp8266 --additional-urls "$URL_ESP8266"
      - name: Compilar (Generic ESP8266 Module)
        run: arduino-cli compile --fqbn esp8266:esp8266:generic --warnings default sino-gps/sino_gps
      - name: Compilar (NodeMCU 1.0, a placa indicada no README)
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings default sino-gps/sino_gps

  teste-rede-esp8266:
    name: Teste de rede (ESP-12 / ESP8266)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar pacote ESP8266
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP8266"
          arduino-cli core install esp8266:esp8266 --additional-urls "$URL_ESP8266"
      - name: Compilar (ESP-12 avulso, Generic ESP8266 Module 4MB)
        run: arduino-cli compile --fqbn esp8266:esp8266:generic:eesz=4M2M --warnings default teste-rede/teste_rede
      - name: Compilar (NodeMCU 1.0)
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings default teste-rede/teste_rede

  teste-rede-esp32:
    name: Teste de rede (${{ matrix.placa.nome }}, pacote ${{ matrix.versao }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versao: ["2.0.17", "ultima"]
        placa:
          - { nome: "ESP32 Dev Module", fqbn: "esp32:esp32:esp32" }
          - { nome: "ESP32-C3 Dev Module", fqbn: "esp32:esp32:esp32c3:CDCOnBoot=cdc" }
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar pacote ESP32
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          if [ "${{ matrix.versao }}" = "ultima" ]; then NUCLEO=esp32:esp32; else NUCLEO=esp32:esp32@${{ matrix.versao }}; fi
          arduino-cli core install "$NUCLEO" --additional-urls "$URL_ESP32"
          arduino-cli core list
      - name: Compilar
        run: arduino-cli compile --fqbn "${{ matrix.placa.fqbn }}" --warnings default teste-rede/teste_rede
